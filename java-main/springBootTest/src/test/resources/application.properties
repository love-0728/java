# 测试环境：H2 内存数据库（MySQL 兼容模式），不连接真实 MySQL
# 注意：本文件位于 src/test/resources，会覆盖主资源的 application.properties，
# 因此测试时 spring.profiles.active=dev 不会生效，也不会加载 application-dev.properties
spring.datasource.url=jdbc:h2:mem:kitty_test;MODE=MySQL;NON_KEYWORDS=USER;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 启动时用 schema.sql 建表
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# MyBatis-Plus
mybatis-plus.global-config.db-config.id-type=auto
