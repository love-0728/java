server.port=8081

# ---------- MySQL 数据源 ----------
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/kitty_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=APT
spring.datasource.password=123456

# ---------- MyBatis-Plus ----------
# 控制台打印 SQL，方便调试
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 主键自增策略交给数据库 AUTO_INCREMENT
mybatis-plus.global-config.db-config.id-type=auto
