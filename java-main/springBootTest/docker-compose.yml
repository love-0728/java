services:
  mysql:
    image: mysql:8.0
    container_name: kitty-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: kitty_db
      MYSQL_USER: APT
      MYSQL_PASSWORD: 123456
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建库建表脚本
      - ./sql/kitty_db.sql:/docker-entrypoint-initdb.d/kitty_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: kitty-app
    depends_on:
      mysql:
        condition: service_healthy   # 等 MySQL 就绪后再启动应用
    environment:
      SPRING_PROFILES_ACTIVE: docker
      TZ: Asia/Shanghai
    ports:
      - "8081:8081"

volumes:
  mysql-data:
