name: Java CI with Maven

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: 编译 + 运行全部测试 + 打包
        # 测试用 H2 内存库，CI 环境无需 MySQL
        run: mvn -B package

      - name: 上传 jar 产物
        uses: actions/upload-artifact@v4
        with:
          name: springBootTest-jar
          path: target/springBootTest-0.0.1-SNAPSHOT.jar
          retention-days: 7
