<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>穿越时空中…</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(circle at center, #3a2170 0%, #170a36 55%, #07021a 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }

  /* 星空 / 光速隧道 */
  .stars { position: absolute; inset: 0; z-index: 1; }
  .star {
    position: absolute; top: 50%; left: 50%;
    width: 3px; height: 3px; border-radius: 50%;
    background: #fff; box-shadow: 0 0 8px #fff, 0 0 14px #c9a7ff;
    transform: translate(-50%, -50%);
    opacity: 0;
    animation: warp linear infinite;
  }
  @keyframes warp {
    0%   { transform: translate(-50%, -50%) translate(0,0) scale(.25); opacity: 0; }
    12%  { opacity: 1; }
    100% { transform: translate(-50%, -50%) translate(var(--tx), var(--ty)) scale(2.2); opacity: 0; }
  }

  /* 中心漩涡传送门 */
  .portal-wrap {
    position: absolute; top: 50%; left: 50%;
    width: 260px; height: 260px;
    transform: translate(-50%, -50%);
    z-index: 2;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .portal {
    width: 100%; height: 100%; border-radius: 50%;
    background: conic-gradient(from 0deg, #ff9ecb, #b78bff, #7fd4ff, #ffd27f, #ff9ecb);
    filter: blur(3px); opacity: .85; mix-blend-mode: screen;
    animation: spin 2.6s linear infinite;
    box-shadow: 0 0 60px rgba(255,158,203,.6), inset 0 0 50px rgba(183,139,255,.7);
  }
  .portal-core {
    position: absolute; top: 50%; left: 50%;
    width: 120px; height: 120px; transform: translate(-50%,-50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.95), rgba(255,255,255,0) 70%);
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes spin  { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: translate(-50%, -50%) scale(1.18); } }
  /* 兼容 portal-wrap 自身居中 + 脉冲：用额外层 */
  .portal-wrap { animation: wrapPulse 1.8s ease-in-out infinite; }
  @keyframes wrapPulse { 50% { transform: translate(-50%,-50%) scale(1.12); } }

  /* 文字 */
  .caption {
    position: absolute; bottom: 16%; left: 0; right: 0; z-index: 3;
    text-align: center; color: #fff;
  }
  .caption .big {
    font-size: 30px; font-weight: 800; letter-spacing: 4px;
    text-shadow: 0 0 16px #ffb3df, 0 0 30px #b78bff;
    animation: glow 1.6s ease-in-out infinite;
  }
  .caption .sub { margin-top: 10px; font-size: 14px; color: #e7d7ff; letter-spacing: 2px; }
  @keyframes glow { 50% { opacity: .55; text-shadow: 0 0 26px #ffb3df, 0 0 50px #b78bff; } }

  .loading {
    position: absolute; bottom: 9%; left: 50%; transform: translateX(-50%); z-index: 3;
    width: 160px; height: 4px; border-radius: 999px; background: rgba(255,255,255,.18); overflow: hidden;
  }
  .loading::after {
    content: ""; position: absolute; left: 0; top: 0; height: 100%; width: 40%;
    border-radius: 999px; background: linear-gradient(90deg, #ff9ecb, #b78bff);
    animation: load 1.4s ease-in-out infinite;
  }
  @keyframes load { 0%{left:-40%} 100%{left:100%} }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="portal-wrap">
    <div class="portal"></div>
    <div class="portal-core"></div>
  </div>

  <div class="caption">
    <div class="big">✦ 穿越时空中 ✦</div>
    <div class="sub">正在前往 Hello Kitty 的家族…</div>
  </div>
  <div class="loading"></div>

<script>
  // 生成光速粒子
  const stars = document.getElementById('stars');
  const N = 150;
  for (let i = 0; i < N; i++) {
    const s = document.createElement('span');
    s.className = 'star';
    const ang = Math.random() * Math.PI * 2;
    const dist = 220 + Math.random() * 620;
    s.style.setProperty('--tx', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--ty', Math.sin(ang) * dist + 'px');
    const size = (1 + Math.random() * 2.6).toFixed(1);
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.animationDuration = (1.3 + Math.random() * 1.5).toFixed(2) + 's';
    s.style.animationDelay = (Math.random() * 1.8).toFixed(2) + 's';
    stars.appendChild(s);
  }

  // 读取用户名并跳转至家族页
  const params = new URLSearchParams(location.search);
  const user = params.get('user') || '';
  setTimeout(() => {
    location.href = 'home.html?user=' + encodeURIComponent(user);
  }, 2900);
</script>
</body>
</html>
