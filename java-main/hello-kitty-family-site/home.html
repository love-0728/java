<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Kitty · 首页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink-50:  #fff5f8;
    --pink-100: #ffe3ee;
    --pink-200: #ffc9de;
    --pink-300: #ffa8c9;
    --pink-400: #ff8ab8;
    --pink-500: #f76fa5;
    --pink-600: #e75a92;
    --red:      #e8404f;
    --ink:      #5c4a52;
    --ink-soft: #a08793;
    --bg:       linear-gradient(135deg, #ffe9f2 0%, #ffd6e7 45%, #ffc4dd 100%);
    --heart-color: var(--pink-300);
  }

  body {
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    transition: background .6s ease;
    padding: 92px 22px 60px;
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- 背景漂浮装饰（与登录页一致） ---------- */
  .deco { position: fixed; pointer-events: none; opacity: .5; animation: floaty 6s ease-in-out infinite; z-index: 0; }
  .heart { width: 26px; height: 26px; background: var(--heart-color); transform: rotate(45deg); border-radius: 4px 4px 0 0; position: relative; transition: background .6s ease; }
  .heart::before, .heart::after { content: ""; position: absolute; width: 26px; height: 26px; background: var(--heart-color); border-radius: 50%; }
  .heart::before { left: -13px; } .heart::after { top: -13px; }
  .d1 { top: 12%; left: 6%; } .d2 { top: 78%; left: 4%; animation-delay: 1.2s; transform: rotate(45deg) scale(.7); }
  .d3 { top: 16%; right: 7%; animation-delay: .6s; } .d4 { top: 80%; right: 9%; animation-delay: 1.8s; transform: rotate(45deg) scale(.85); }
  .d5 { top: 46%; left: 12%; animation-delay: 2.4s; transform: rotate(45deg) scale(.55); } .d6 { top: 40%; right: 14%; animation-delay: 3s; transform: rotate(45deg) scale(.6); }
  @keyframes floaty { 0%,100% { translate: 0 0; } 50% { translate: 0 -16px; } }

  /* ---------- 顶部导航栏 ---------- */
  .nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    display: flex; align-items: center; gap: 18px;
    padding: 14px 26px;
    background: rgba(255,255,255,.78);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid rgba(255,168,201,.35);
    box-shadow: 0 6px 22px rgba(231,90,146,.12);
  }
  .nav .logo {
    display: flex; align-items: center; gap: 8px;
    font-size: 19px; font-weight: 800; color: var(--pink-600);
    letter-spacing: .5px; white-space: nowrap;
  }
  .nav .logo .bow { font-size: 20px; }
  .nav .links { display: flex; gap: 6px; margin-left: 8px; flex: 1; flex-wrap: wrap; }
  .nav .links a {
    position: relative;
    padding: 8px 14px; border-radius: 999px;
    color: var(--ink); text-decoration: none; font-size: 14px; font-weight: 600;
    transition: all .2s;
  }
  .nav .links a:hover { color: var(--pink-600); background: var(--pink-50); }
  .nav .links a.active { color: #fff; background: linear-gradient(135deg, var(--pink-400), var(--pink-600)); box-shadow: 0 4px 12px rgba(231,90,146,.3); }
  .nav .user { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .nav .chip {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 12px 5px 6px; border-radius: 999px;
    background: var(--pink-50); border: 2px solid var(--pink-100);
  }
  .nav .chip .ava { width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, var(--pink-300), var(--pink-500)); display: grid; place-items: center; font-size: 14px; }
  .nav .chip .nm { font-size: 13px; font-weight: 700; color: var(--ink); max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
  .nav .logout {
    border: 2px solid var(--pink-100); background: #fff; color: var(--pink-600);
    padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer;
    transition: all .2s;
  }
  .nav .logout:hover { background: var(--pink-100); transform: translateY(-1px); }

  .wrap { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; }

  /* ---------- 英雄区 + 搜索栏 ---------- */
  .hero { text-align: center; margin: 18px 0 34px; }
  .hero h1 { font-size: 30px; color: var(--pink-600); letter-spacing: 1px; font-weight: 800; }
  .hero h1 span { color: var(--red); }
  .hero .sub { color: var(--ink-soft); font-size: 14.5px; margin: 10px 0 24px; }

  .search {
    display: flex; align-items: center; gap: 8px;
    max-width: 560px; margin: 0 auto;
    background: rgba(255,255,255,.95);
    border: 2px solid var(--pink-100);
    border-radius: 999px; padding: 7px 7px 7px 16px;
    box-shadow: 0 10px 30px rgba(231,90,146,.18);
    transition: border-color .25s, box-shadow .25s;
  }
  .search:focus-within { border-color: var(--pink-400); box-shadow: 0 0 0 4px rgba(255,138,184,.18), 0 10px 30px rgba(231,90,146,.2); }
  .search .s-icon { font-size: 17px; opacity: .7; }
  .search input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--ink); padding: 8px 4px;
  }
  .search input::placeholder { color: #c9a9b6; }
  .search .s-btn {
    border: none; border-radius: 999px; padding: 11px 26px;
    background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
    color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 2px; cursor: pointer;
    box-shadow: 0 6px 16px rgba(231,90,146,.35); transition: transform .2s, box-shadow .2s;
  }
  .search .s-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 22px rgba(231,90,146,.45); }
  .search .s-btn:active { transform: translateY(0); }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
  .chips .chip {
    border: 1.5px solid var(--pink-200); background: rgba(255,255,255,.7);
    color: var(--pink-600); font-size: 12.5px; font-weight: 600;
    padding: 5px 13px; border-radius: 999px; cursor: pointer; transition: all .2s;
  }
  .chips .chip:hover { background: var(--pink-200); transform: translateY(-1px); }

  /* ---------- 内容面板 ---------- */
  .panel {
    background: rgba(255,255,255,.9);
    backdrop-filter: blur(8px);
    border-radius: 26px; padding: 26px 26px 30px;
    box-shadow: 0 18px 50px rgba(231,90,146,.18);
  }
  .section-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .section-head h2 { font-size: 20px; color: var(--pink-600); font-weight: 800; }
  .section-head .count { font-size: 12.5px; color: var(--ink-soft); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
  .member {
    background: var(--pink-50); border: 2px solid var(--pink-100);
    border-radius: 20px; padding: 14px; text-align: center; cursor: pointer;
    transition: transform .2s, box-shadow .2s, border-color .2s;
  }
  .member:hover { transform: translateY(-4px); box-shadow: 0 12px 26px rgba(231,90,146,.22); border-color: var(--pink-300); }
  .member .media {
    position: relative; width: 100%; height: 130px; border-radius: 16px; overflow: hidden;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #ffeef5, #ffd9e8);
  }
  .member .media img { width: 100%; height: 100%; object-fit: contain; transition: transform .3s; }
  .member:hover .media img { transform: scale(1.06); }
  .member .media .fallback { font-size: 38px; }
  .member .name { margin-top: 10px; font-size: 15px; font-weight: 800; color: var(--ink); }
  .member .role { margin-top: 3px; font-size: 12px; color: var(--ink-soft); }
  .member mark { background: #fff2b8; color: var(--red); border-radius: 4px; padding: 0 2px; }

  .empty { text-align: center; color: var(--ink-soft); font-size: 14px; padding: 30px 0; }

  footer { text-align: center; color: var(--ink-soft); font-size: 12.5px; margin-top: 26px; }

  /* ---------- 提示气泡 + 背景切换（与登录页一致） ---------- */
  .toast {
    position: fixed; left: 50%; bottom: 36px;
    transform: translateX(-50%) translateY(20px);
    background: #fff; color: var(--pink-600);
    border: 2px solid var(--pink-200); border-radius: 999px;
    padding: 10px 22px; font-size: 14px; font-weight: 600;
    box-shadow: 0 10px 30px rgba(231,90,146,.25);
    opacity: 0; pointer-events: none; transition: all .35s; z-index: 40;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .bg-switch {
    position: fixed; right: 20px; bottom: 20px; z-index: 40;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border: 2px solid rgba(255,255,255,.7); border-radius: 999px;
    background: rgba(255,255,255,.6); backdrop-filter: blur(6px);
    color: var(--pink-600); font-size: 13px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 18px rgba(231,90,146,.25); transition: transform .2s, box-shadow .2s; user-select: none;
  }
  .bg-switch:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 24px rgba(231,90,146,.35); }
  .bg-switch:active { transform: scale(.96); }
  .bg-switch .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; background: linear-gradient(135deg, #ff8ab8, #f76fa5); }

  @media (max-width: 560px) {
    .nav { gap: 10px; padding: 12px 16px; }
    .nav .links { display: none; }
    .hero h1 { font-size: 25px; }
  }
</style>
</head>
<body>

  <div class="deco d1"><div class="heart"></div></div>
  <div class="deco d2"><div class="heart"></div></div>
  <div class="deco d3"><div class="heart"></div></div>
  <div class="deco d4"><div class="heart"></div></div>
  <div class="deco d5"><div class="heart"></div></div>
  <div class="deco d6"><div class="heart"></div></div>

  <!-- 导航栏 -->
  <nav class="nav">
    <div class="logo"><span class="bow">🎀</span> Hello Kitty</div>
    <div class="links">
      <a href="home.html" class="active">首页</a>
      <a href="family.html" data-page="家族">家族</a>
      <a href="#" data-page="相册">相册</a>
      <a href="#" data-page="社区">社区</a>
      <a href="#" data-page="关于">关于</a>
    </div>
    <div class="user">
      <div class="chip"><span class="ava">🐱</span><span class="nm" id="navName">小伙伴</span></div>
      <button class="logout" id="logoutBtn">退出</button>
    </div>
  </nav>

  <main class="wrap">
    <!-- 英雄区 + 搜索栏 -->
    <section class="hero">
      <h1>欢迎回来，<span id="uname">小伙伴</span> ♡</h1>
      <p class="sub">今天想看点什么呢？搜一搜，或者逛逛上方的导航～</p>

      <form class="search" id="searchForm">
        <span class="s-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索家族成员、相册、话题…" autocomplete="off">
        <button type="submit" class="s-btn">搜索</button>
      </form>

      <div class="chips" id="chips"></div>
    </section>

    <!-- 家族成员（搜索可过滤，纯前端） -->
    <section class="panel">
      <div class="section-head">
        <h2>家族成员</h2>
        <span class="count" id="count"></span>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden>🙈 没有找到匹配的成员，换个关键词试试～</p>
    </section>

    <footer>Hello Kitty 主题家族网站 · 首页（演示数据，名字与图片可自由替换）</footer>
  </main>

  <div class="bg-switch" id="bgSwitch" title="点击切换背景">
    <span class="dot" id="bgDot"></span>
    换背景 🎀
  </div>

  <div class="toast" id="toast"></div>

<script>
  // ---------- 读取登录用户 ----------
  const params = new URLSearchParams(location.search);
  let user = params.get('user') || localStorage.getItem('hk_user') || '小伙伴';
  document.getElementById('uname').textContent = user;
  document.getElementById('navName').textContent = user;

  // ---------- 提示气泡 ----------
  const toast = document.getElementById('toast');
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  // ---------- 家族成员演示数据（前端，可替换） ----------
  const members = [
    { name: '棉花糖', role: '元气担当', img: 'characters/char_01.png' },
    { name: '草莓酱', role: '甜点达人', img: 'characters/char_02.png' },
    { name: '月亮船', role: '安静治愈', img: 'characters/char_03.png' },
    { name: '小铃铛', role: '活力担当', img: 'characters/char_04.png' },
    { name: '薄荷糖', role: '清凉系',   img: 'characters/char_05.png' },
    { name: '布丁',   role: '软萌担当', img: 'characters/char_06.png' },
    { name: '星之卡', role: '神秘系',   img: 'characters/char_07.png' },
    { name: '蜜桃',   role: '甜美担当', img: 'characters/char_08.png' },
    { name: '可可',   role: '暖心系',   img: 'characters/char_09.png' },
    { name: '云朵',   role: '治愈系',   img: 'characters/char_10.png' },
    { name: '樱桃',   role: '俏皮担当', img: 'characters/char_11.png' },
    { name: '蓝莓',   role: '安静系',   img: 'characters/char_12.png' }
  ];

  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  const countEl = document.getElementById('count');

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function highlight(text, kw) {
    if (!kw) return escapeHtml(text);
    const i = text.toLowerCase().indexOf(kw.toLowerCase());
    if (i < 0) return escapeHtml(text);
    return escapeHtml(text.slice(0, i)) + '<mark>' + escapeHtml(text.slice(i, i + kw.length)) + '</mark>' + escapeHtml(text.slice(i + kw.length));
  }

  function render(list, kw) {
    grid.innerHTML = '';
    list.forEach(m => {
      const el = document.createElement('div');
      el.className = 'member';
      el.innerHTML =
        '<div class="media">' +
          '<img src="' + m.img + '" alt="' + escapeHtml(m.name) + '" onerror="this.style.display=\'none\'">' +
          '<span class="fallback" style="display:none">🎀</span>' +
        '</div>' +
        '<div class="name">' + highlight(m.name, kw) + '</div>' +
        '<div class="role">' + highlight(m.role, kw) + '</div>';
      // 图片加载失败时显示 fallback
      const img = el.querySelector('img');
      const fb = el.querySelector('.fallback');
      img.addEventListener('error', () => { img.style.display = 'none'; fb.style.display = 'block'; });
      el.addEventListener('click', () => showToast('♡ 你戳了戳 ' + m.name + '～'));
      grid.appendChild(el);
    });
    empty.hidden = list.length !== 0;
    countEl.textContent = '共 ' + list.length + ' 位';
  }

  // ---------- 搜索（纯前端过滤） ----------
  const input = document.getElementById('searchInput');
  function doFilter() {
    const kw = input.value.trim();
    const list = members.filter(m =>
      m.name.toLowerCase().includes(kw.toLowerCase()) ||
      m.role.toLowerCase().includes(kw.toLowerCase())
    );
    render(list, kw);
  }
  document.getElementById('searchForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!input.value.trim()) { showToast('🔍 先输入点什么再搜吧～'); return; }
    doFilter();
    showToast('🔍 为你找到 ' + grid.children.length + ' 位相关成员');
  });
  input.addEventListener('input', doFilter);

  // ---------- 热门搜索 chips ----------
  const hot = ['棉花糖', '草莓酱', '小铃铛', '布丁', '蜜桃'];
  const chipsBox = document.getElementById('chips');
  hot.forEach(h => {
    const c = document.createElement('span');
    c.className = 'chip';
    c.textContent = '🔥 ' + h;
    c.addEventListener('click', () => { input.value = h; doFilter(); });
    chipsBox.appendChild(c);
  });

  // ---------- 导航：未建页面给提示 ----------
  document.querySelectorAll('.nav .links a[data-page]').forEach(a => {
    a.addEventListener('click', (e) => {
      if (a.getAttribute('href') === '#') {
        e.preventDefault();
        showToast('🎀 「' + a.dataset.page + '」页面还在建设中哦～');
      }
    });
  });

  // ---------- 退出（仅清前端登录态，不动后端） ----------
  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('hk_user');
    showToast('👋 已退出登录');
    setTimeout(() => { location.href = 'hello-kitty-login.html'; }, 900);
  });

  // ---------- 右下角背景切换（与登录页一致） ----------
  const themes = [
    { name: '草莓粉', bg: 'linear-gradient(135deg, #ffe9f2 0%, #ffd6e7 45%, #ffc4dd 100%)', heart: '#ffa8c9' },
    { name: '天空蓝', bg: 'linear-gradient(135deg, #e3f2ff 0%, #cfe6ff 45%, #bcdcff 100%)', heart: '#9ec5ff' },
    { name: '梦幻紫', bg: 'linear-gradient(135deg, #f3e6ff 0%, #e6d2ff 45%, #d9bdff 100%)', heart: '#c9a3ff' },
    { name: '薄荷绿', bg: 'linear-gradient(135deg, #e6fff4 0%, #d2ffe9 45%, #bdf7da 100%)', heart: '#7fe3b8' },
    { name: '蜜桃橙', bg: 'linear-gradient(135deg, #fff0e6 0%, #ffdcc7 45%, #ffc9b0 100%)', heart: '#ffb38f' },
    { name: '晚霞紫粉', bg: 'linear-gradient(135deg, #ffe8e0 0%, #ffd1e8 50%, #e8d1ff 100%)', heart: '#f3a7d6' }
  ];
  let themeIdx = 0;
  const bgSwitch = document.getElementById('bgSwitch');
  const bgDot = document.getElementById('bgDot');
  function applyTheme() {
    const t = themes[themeIdx];
    const root = document.documentElement;
    root.style.setProperty('--bg', t.bg);
    root.style.setProperty('--heart-color', t.heart);
    bgDot.style.background = t.bg;
    bgSwitch.lastChild.textContent = ' 换背景（' + t.name + '）';
  }
  bgSwitch.addEventListener('click', () => {
    themeIdx = (themeIdx + 1) % themes.length;
    applyTheme();
    showToast('🎨 已切换到「' + themes[themeIdx].name + '」背景');
  });

  // 初始渲染
  render(members, '');
</script>
</body>
</html>
