<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello Kitty · 登录</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink-50:  #fff5f8;
    --pink-100: #ffe3ee;
    --pink-200: #ffc9de;
    --pink-300: #ffa8c9;
    --pink-400: #ff8ab8;
    --pink-500: #f76fa5;
    --pink-600: #e75a92;
    --red:      #e8404f;
    --ink:      #5c4a52;
    --ink-soft: #a08793;
    --bg:       linear-gradient(135deg, #ffe9f2 0%, #ffd6e7 45%, #ffc4dd 100%);
    --heart-color: var(--pink-300);
  }

  body {
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: var(--bg);
    transition: background .6s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow-x: hidden;
    position: relative;
  }

  /* ---------- 背景漂浮装饰 ---------- */
  .deco {
    position: fixed;
    pointer-events: none;
    opacity: .55;
    animation: floaty 6s ease-in-out infinite;
    z-index: 0;
  }
  .heart {
    width: 26px; height: 26px;
    background: var(--heart-color);
    transform: rotate(45deg);
    border-radius: 4px 4px 0 0;
    position: relative;
    transition: background .6s ease;
  }
  .heart::before, .heart::after {
    content: ""; position: absolute; width: 26px; height: 26px;
    background: var(--heart-color); border-radius: 50%;
  }
  .heart::before { left: -13px; }
  .heart::after  { top: -13px; }

  .d1 { top: 12%; left: 10%; animation-delay: 0s; }
  .d2 { top: 68%; left: 6%;  animation-delay: 1.2s; transform: rotate(45deg) scale(.7); }
  .d3 { top: 18%; right: 9%; animation-delay: .6s; }
  .d4 { top: 74%; right: 12%; animation-delay: 1.8s; transform: rotate(45deg) scale(.85); }
  .d5 { top: 44%; left: 18%; animation-delay: 2.4s; transform: rotate(45deg) scale(.55); }
  .d6 { top: 40%; right: 20%; animation-delay: 3s; transform: rotate(45deg) scale(.6); }

  @keyframes floaty {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -16px; }
  }

  /* ---------- 卡片 ---------- */
  .card {
    position: relative;
    z-index: 1;
    width: 400px;
    max-width: 100%;
    background: rgba(255, 255, 255, .92);
    backdrop-filter: blur(8px);
    border-radius: 28px;
    padding: 40px 36px 30px;
    box-shadow:
      0 20px 60px rgba(231, 90, 146, .25),
      0 4px 16px rgba(231, 90, 146, .12);
    text-align: center;
  }

  /* 顶部蝴蝶结丝带 */
  .ribbon {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 26px;
    background: linear-gradient(90deg, var(--red), #ff6b6b);
    clip-path: polygon(0 0, 100% 0, 92% 100%, 8% 100%);
    border-radius: 0 0 8px 8px;
  }

  /* ---------- Kitty 全身展示 ---------- */
  .avatar-wrap {
    width: 100%;
    height: 340px;
    margin: 8px 0 16px;
    border-radius: 22px;
    background: linear-gradient(135deg, #fff3f8, #ffe6f0);
    border: none;
    overflow: hidden;
    box-shadow: none;
    animation: bounce 3.2s ease-in-out infinite;
  }
  .avatar-wrap img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  h1 {
    font-size: 28px;
    color: var(--pink-600);
    letter-spacing: 1px;
    font-weight: 800;
  }
  h1 span { color: var(--red); }
  .subtitle {
    color: var(--ink-soft);
    font-size: 13.5px;
    margin: 8px 0 26px;
  }

  /* ---------- 表单 ---------- */
  .field {
    position: relative;
    margin-bottom: 16px;
  }
  .field .icon {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    opacity: .75;
  }
  .field input {
    width: 100%;
    padding: 13px 44px 13px 42px;
    border: 2px solid var(--pink-100);
    border-radius: 999px;
    background: var(--pink-50);
    font-size: 14px;
    color: var(--ink);
    outline: none;
    transition: all .25s;
  }
  .field input::placeholder { color: #c9a9b6; }
  .field input:focus {
    border-color: var(--pink-400);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(255, 138, 184, .18);
  }
  .toggle-eye {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    border: none; background: none;
    cursor: pointer; font-size: 15px;
    opacity: .6;
  }
  .toggle-eye:hover { opacity: 1; }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 4px 4px 20px;
  }
  .row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .row input[type="checkbox"] {
    accent-color: var(--pink-500);
    width: 15px; height: 15px;
  }
  .row a { color: var(--pink-500); text-decoration: none; }
  .row a:hover { text-decoration: underline; }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 6px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(231, 90, 146, .35);
    transition: transform .2s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(231, 90, 146, .45); }
  .btn:active { transform: translateY(0); }

  .divider {
    display: flex; align-items: center;
    gap: 12px;
    color: #d3b6c2;
    font-size: 12px;
    margin: 22px 0 16px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, var(--pink-200), transparent);
  }

  .socials {
    display: flex; justify-content: center; gap: 14px;
    margin-bottom: 22px;
  }
  .socials button {
    width: 42px; height: 42px;
    border-radius: 50%;
    border: 2px solid var(--pink-100);
    background: var(--pink-50);
    font-size: 18px;
    cursor: pointer;
    transition: all .2s;
  }
  .socials button:hover {
    background: var(--pink-200);
    transform: translateY(-3px) scale(1.06);
  }

  .footer { font-size: 13px; color: var(--ink-soft); }
  .footer a { color: var(--pink-500); font-weight: 600; text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  /* ---------- 右下角背景切换 ---------- */
  .bg-switch {
    position: fixed;
    right: 20px; bottom: 20px;
    z-index: 10;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    border: 2px solid rgba(255,255,255,.7);
    border-radius: 999px;
    background: rgba(255,255,255,.6);
    backdrop-filter: blur(6px);
    color: var(--pink-600);
    font-size: 13px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(231, 90, 146, .25);
    transition: transform .2s, box-shadow .2s;
    user-select: none;
  }
  .bg-switch:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 10px 24px rgba(231, 90, 146, .35); }
  .bg-switch:active { transform: scale(.96); }
  .bg-switch .dot {
    width: 16px; height: 16px; border-radius: 50%;
    border: 2px solid #fff;
    background: linear-gradient(135deg, #ff8ab8, #f76fa5);
    box-shadow: 0 0 0 1px rgba(231,90,146,.3);
  }

  /* ---------- 提示气泡 ---------- */
  .toast {
    position: fixed;
    left: 50%; bottom: 36px;
    transform: translateX(-50%) translateY(20px);
    background: #fff;
    color: var(--pink-600);
    border: 2px solid var(--pink-200);
    border-radius: 999px;
    padding: 10px 22px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(231, 90, 146, .25);
    opacity: 0;
    pointer-events: none;
    transition: all .35s;
    z-index: 9;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 440px) {
    .card { padding: 34px 24px 26px; }
  }

  /* ---------- 忘记密码弹窗 ---------- */
  .modal-mask {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(92,74,82,.38);
    backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal-mask.show { display: flex; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal-mask .card { margin: 0; width: 380px; }
  .modal-mask .avatar-wrap { height: 150px; margin: 8px 0 14px; }

  /* 表单错误提示（与注册页一致） */
  .field .msg {
    display: block; text-align: left; font-size: 11.5px;
    color: var(--red); margin: 5px 0 0 42px; height: 0; opacity: 0; transition: all .2s;
  }
  .field.error input { border-color: var(--red); background: #fff5f6; box-shadow: 0 0 0 4px rgba(232,64,79,.12); }
  .field.error .msg { height: auto; opacity: 1; }
  .field.code-field input { padding-right: 120px; }
  .code-btn {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    border: none; border-radius: 999px; padding: 7px 14px;
    background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
    color: #fff; font-size: 12.5px; font-weight: 700; cursor: pointer;
    box-shadow: 0 4px 10px rgba(231,90,146,.3); transition: transform .15s, opacity .2s; white-space: nowrap;
  }
  .code-btn:hover { transform: translateY(-50%) scale(1.04); }
  .code-btn:active { transform: translateY(-50%) scale(.96); }
  .code-btn:disabled { opacity: .55; cursor: not-allowed; transform: translateY(-50%); box-shadow: none; }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .field.shake { animation: shake .3s; }
</style>
</head>
<body>

  <div class="deco d1"><div class="heart"></div></div>
  <div class="deco d2"><div class="heart"></div></div>
  <div class="deco d3"><div class="heart"></div></div>
  <div class="deco d4"><div class="heart"></div></div>
  <div class="deco d5"><div class="heart"></div></div>
  <div class="deco d6"><div class="heart"></div></div>

  <div class="card">
    <div class="ribbon"></div>

    <div class="avatar-wrap">
      <img src="kitty-cutout.png" alt="Hello Kitty 全身照（已抠图）">
    </div>

    <h1>Hello <span>Kitty</span> ♡</h1>
    <p class="subtitle">欢迎回来～今天也要元气满满哦！</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <span class="icon">🎀</span>
        <input type="text" id="username" placeholder="用户名 / 邮箱" autocomplete="username">
      </div>

      <div class="field">
        <span class="icon">🔒</span>
        <input type="password" id="password" placeholder="密码" autocomplete="current-password">
        <button type="button" class="toggle-eye" id="toggleEye" aria-label="显示密码">👁️</button>
      </div>

      <div class="row">
        <label><input type="checkbox" id="remember"> 记住我</label>
        <a href="#" id="openForgot">忘记密码？</a>
      </div>

      <button type="submit" class="btn">登 录</button>
    </form>

    <div class="divider">其他方式登录</div>
    <div class="socials">
      <button title="微信">💬</button>
      <button title="QQ">🐧</button>
      <button title="手机号">📱</button>
    </div>

    <p class="footer">还没有账号？<a href="hello-kitty-register.html">立即注册 →</a></p>
  </div>

  <!-- 忘记密码弹窗 -->
  <div class="modal-mask" id="forgotMask">
    <div class="card">
      <div class="ribbon"></div>
      <div class="avatar-wrap"><img src="kitty-cutout.png" alt="Hello Kitty"></div>
      <h1>找回密码 <span>♡</span></h1>
      <p class="subtitle">填邮箱收验证码，重设你的密码吧</p>
      <form id="forgotForm" novalidate>
        <div class="field" id="f-femail">
          <span class="icon">✉️</span>
          <input type="email" id="femail" placeholder="注册时用的邮箱" autocomplete="email">
          <span class="msg" id="m-femail"></span>
        </div>
        <div class="field code-field" id="f-fcode">
          <span class="icon">🔢</span>
          <input type="text" id="fcode" placeholder="邮箱验证码（6 位）" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
          <button type="button" class="code-btn" id="getFCode">获取验证码</button>
          <span class="msg" id="m-fcode"></span>
        </div>
        <div class="field" id="f-fpwd">
          <span class="icon">🔒</span>
          <input type="password" id="fpwd" placeholder="新密码（至少 6 位）" autocomplete="new-password">
          <span class="msg" id="m-fpwd"></span>
        </div>
        <button type="submit" class="btn">重 置</button>
      </form>
      <p class="footer"><a href="#" id="backToLogin">← 返回登录</a></p>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="bg-switch" id="bgSwitch" title="点击切换背景">
    <span class="dot" id="bgDot"></span>
    换背景 🎀
  </div>

<script>
  // 密码显示/隐藏
  const pwd = document.getElementById('password');
  const eye = document.getElementById('toggleEye');
  eye.addEventListener('click', () => {
    const show = pwd.type === 'password';
    pwd.type = show ? 'text' : 'password';
    eye.textContent = show ? '🙈' : '👁️';
  });

  // 简单校验 + 可爱提示
  const toast = document.getElementById('toast');
  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 2200);
  }

  const loginForm = document.getElementById('loginForm');
  const loginBtn = loginForm.querySelector('.btn');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const user = document.getElementById('username').value.trim();
    if (!user) { showToast('🎀 请先填写用户名哦～'); return; }
    if (!pwd.value) { showToast('🔒 密码还没有输入呢～'); return; }

    loginBtn.disabled = true;
    loginBtn.textContent = '登录中…';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: user, password: pwd.value })
      });
      const data = await res.json();
      if (data.ok) {
        localStorage.setItem('hk_user', data.username); // 记下登录态
        showToast('♡ 登录成功，正在穿越时空…');
        setTimeout(() => {
          window.location.href = 'transition.html?user=' + encodeURIComponent(data.username);
        }, 1100);
      } else {
        loginBtn.disabled = false;
        loginBtn.textContent = '登 录';
        showToast('🙈 ' + data.msg);
      }
    } catch (err) {
      loginBtn.disabled = false;
      loginBtn.textContent = '登 录';
      showToast('⚠️ 无法连接服务器，请先运行后端 server.js');
    }
  });

  // ---------- 忘记密码弹窗 ----------
  const forgotMask = document.getElementById('forgotMask');
  const femail = document.getElementById('femail');
  const fcode = document.getElementById('fcode');
  const fpwd = document.getElementById('fpwd');
  const getFCodeBtn = document.getElementById('getFCode');
  const forgotForm = document.getElementById('forgotForm');

  function fSetError(key, msg) {
    const w = document.getElementById('f-' + key);
    w.classList.add('error');
    document.getElementById('m-' + key).textContent = msg;
    w.classList.remove('shake'); void w.offsetWidth; w.classList.add('shake');
  }
  function fClearError(key) {
    const w = document.getElementById('f-' + key);
    w.classList.remove('error');
    document.getElementById('m-' + key).textContent = '';
  }

  document.getElementById('openForgot').addEventListener('click', (e) => {
    e.preventDefault();
    forgotMask.classList.add('show');
  });
  document.getElementById('backToLogin').addEventListener('click', (e) => {
    e.preventDefault();
    forgotMask.classList.remove('show');
  });
  forgotMask.addEventListener('click', (e) => {
    if (e.target === forgotMask) forgotMask.classList.remove('show');
  });

  const fEmailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  let fCodeTimer = null;
  getFCodeBtn.addEventListener('click', async () => {
    const mail = femail.value.trim();
    if (!mail) { fSetError('femail', '✉️ 请先填写邮箱'); return; }
    if (!fEmailRe.test(mail)) { fSetError('femail', '邮箱格式好像不太对～'); return; }
    getFCodeBtn.disabled = true;
    getFCodeBtn.textContent = '发送中…';
    try {
      const r = await fetch('/api/forgot-code', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: mail })
      });
      const d = await r.json();
      if (d.ok) {
        fClearError('femail');
        showToast('✉️ 验证码已发送到你的邮箱～');
        let left = 60;
        getFCodeBtn.textContent = left + ' 秒后重发';
        fCodeTimer = setInterval(() => {
          left--;
          if (left <= 0) { clearInterval(fCodeTimer); getFCodeBtn.disabled = false; getFCodeBtn.textContent = '重新获取'; }
          else getFCodeBtn.textContent = left + ' 秒后重发';
        }, 1000);
      } else {
        getFCodeBtn.disabled = false;
        getFCodeBtn.textContent = '获取验证码';
        fSetError('femail', d.msg || '发送失败，请稍后重试');
      }
    } catch (err) {
      getFCodeBtn.disabled = false;
      getFCodeBtn.textContent = '获取验证码';
      showToast('⚠️ 无法连接服务器，请先运行后端 server.js');
    }
  });

  [femail, fcode, fpwd].forEach(el => el.addEventListener('input', () => {
    const map = { femail: 'femail', fcode: 'fcode', fpwd: 'fpwd' };
    if (document.getElementById('f-' + map[el.id]).classList.contains('error')) fClearError(map[el.id]);
  }));

  forgotForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const mail = femail.value.trim();
    const code = fcode.value.trim();
    const newPwd = fpwd.value;
    if (!mail) { fSetError('femail', '✉️ 请先填写邮箱'); return; }
    if (!code) { fSetError('fcode', '🔢 请填写验证码'); return; }
    if (!/^\d{6}$/.test(code)) { fSetError('fcode', '验证码是 6 位数字哦'); return; }
    if (!newPwd || newPwd.length < 6) { fSetError('fpwd', '🔒 新密码至少 6 位'); return; }
    try {
      const r = await fetch('/api/reset-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: mail, code, password: newPwd })
      });
      const d = await r.json();
      if (d.ok) {
        showToast('♡ 密码已重置，请用新密码登录～');
        setTimeout(() => {
          forgotMask.classList.remove('show');
          femail.value = ''; fcode.value = ''; fpwd.value = '';
        }, 1200);
      } else {
        if (d.msg && d.msg.includes('邮箱')) fSetError('femail', d.msg);
        else if (d.msg && d.msg.includes('验证码')) fSetError('fcode', d.msg);
        else if (d.msg && d.msg.includes('密码')) fSetError('fpwd', d.msg);
        else showToast('🙈 ' + (d.msg || '重置失败'));
      }
    } catch (err) {
      showToast('⚠️ 无法连接服务器，请先运行后端 server.js');
    }
  });

  // ---------- 右下角切换背景 ----------
  const themes = [
    { name: '草莓粉', bg: 'linear-gradient(135deg, #ffe9f2 0%, #ffd6e7 45%, #ffc4dd 100%)', heart: '#ffa8c9' },
    { name: '天空蓝', bg: 'linear-gradient(135deg, #e3f2ff 0%, #cfe6ff 45%, #bcdcff 100%)', heart: '#9ec5ff' },
    { name: '梦幻紫', bg: 'linear-gradient(135deg, #f3e6ff 0%, #e6d2ff 45%, #d9bdff 100%)', heart: '#c9a3ff' },
    { name: '薄荷绿', bg: 'linear-gradient(135deg, #e6fff4 0%, #d2ffe9 45%, #bdf7da 100%)', heart: '#7fe3b8' },
    { name: '蜜桃橙', bg: 'linear-gradient(135deg, #fff0e6 0%, #ffdcc7 45%, #ffc9b0 100%)', heart: '#ffb38f' },
    { name: '晚霞紫粉', bg: 'linear-gradient(135deg, #ffe8e0 0%, #ffd1e8 50%, #e8d1ff 100%)', heart: '#f3a7d6' }
  ];
  let themeIdx = 0;
  const bgSwitch = document.getElementById('bgSwitch');
  const bgDot = document.getElementById('bgDot');
  function applyTheme() {
    const t = themes[themeIdx];
    const root = document.documentElement;
    root.style.setProperty('--bg', t.bg);
    root.style.setProperty('--heart-color', t.heart);
    bgDot.style.background = t.bg;
    bgSwitch.lastChild.textContent = ' 换背景（' + t.name + '）';
  }
  bgSwitch.addEventListener('click', () => {
    themeIdx = (themeIdx + 1) % themes.length;
    applyTheme();
    showToast('🎨 已切换到「' + themes[themeIdx].name + '」背景');
  });
</script>
</body>
</html>
